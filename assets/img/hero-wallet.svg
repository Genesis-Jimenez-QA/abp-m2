<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustración de una billetera digital con monedas">
  <!-- fondo -->
  <circle cx="200" cy="165" r="150" fill="#cfe2ff"/>

  <!-- monedas flotantes -->
  <g>
    <circle cx="95" cy="95" r="22" fill="#ffc107"/>
    <text x="95" y="102" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#7a5b00" text-anchor="middle">$</text>
  </g>
  <g>
    <circle cx="320" cy="120" r="16" fill="#ffc107"/>
    <text x="320" y="126" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#7a5b00" text-anchor="middle">$</text>
  </g>
  <g>
    <circle cx="305" cy="220" r="13" fill="#198754"/>
  </g>

  <!-- sombra de la tarjeta -->
  <rect x="95" y="150" width="220" height="130" rx="18" fill="#062a63" opacity="0.12"/>

  <!-- tarjeta principal -->
  <rect x="85" y="135" width="220" height="130" rx="18" fill="#0d6efd"/>
  <rect x="85" y="135" width="220" height="34" rx="18" fill="#0b5ed7"/>
  <rect x="110" y="185" width="34" height="26" rx="5" fill="#ffc107"/>

  <text x="110" y="245" font-family="Arial, sans-serif" font-size="15" letter-spacing="2" fill="#eaf1ff">•••• •••• •••• 4821</text>
  <text x="110" y="150" font-family="Arial, sans-serif" font-size="13" fill="#eaf1ff" font-weight="600">ALKY-WALLET</text>

  <!-- flecha de movimiento de dinero -->
  <path d="M170 60 q 25 -20 50 0" stroke="#0d6efd" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M212 55 l 8 5 l -3 9" stroke="#0d6efd" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
